[workspace]
members = [
    "crates/kide-core",
    "crates/kide-cli",
]
default-members = ["crates/kide-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sudoHackIn/kide"

[workspace.dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
prost = "0.14.3"
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
