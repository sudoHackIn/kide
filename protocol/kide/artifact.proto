syntax = "proto3";

package kide.artifact.v1;

// Persistent graph-artifact format. This schema deliberately does not import
// worker.proto: a stored blob must stay readable when the disposable-worker
// control plane evolves. The outer envelope is not the cache-file header; it
// protects the protobuf payload after a worker has staged it.
message ArtifactEnvelope {
  uint32 format_version = 1;
  uint64 payload_length = 2;
  bytes payload_sha256 = 3;
  GraphArtifact artifact = 4;
}

// The physical JVM blob is a fixed header followed by this TOC and independent
// protobuf sections. Offsets are absolute byte positions in the blob.
message ArtifactBlobToc {
  uint32 layout_version = 1;
  repeated ArtifactBlobSection sections = 2;
}
message ArtifactBlobSection {
  ArtifactBlobSectionKind kind = 1;
  uint64 offset = 2;
  uint64 length = 3;
  bytes sha256 = 4;
  ArtifactBlobCompression compression = 5;
  uint32 symbol_ordinal_start = 6;
  uint32 symbol_ordinal_end = 7;
}
enum ArtifactBlobCompression {
  ARTIFACT_BLOB_COMPRESSION_NONE = 0;
  ARTIFACT_BLOB_COMPRESSION_GZIP = 1;
}
enum ArtifactBlobSectionKind {
  ARTIFACT_BLOB_SECTION_KIND_UNSPECIFIED = 0;
  ARTIFACT_BLOB_SECTION_KIND_SYMBOL_DICTIONARY = 1;
  ARTIFACT_BLOB_SECTION_KIND_GRAPH_FACTS = 2;
  ARTIFACT_BLOB_SECTION_KIND_SYMBOL_POSTINGS = 3;
  ARTIFACT_BLOB_SECTION_KIND_HIERARCHY_POSTINGS = 4;
  ARTIFACT_BLOB_SECTION_KIND_QUALIFIED_SYMBOL_DIRECTORY = 5;
  ARTIFACT_BLOB_SECTION_KIND_SYMBOL_DETAIL_BLOCK = 6;
}

message ArtifactSymbolDictionary {
  repeated ArtifactSymbolDictionaryEntry entries = 1;
}
message ArtifactSymbolDictionaryEntry { string id = 1; string name = 2; }

// Query-oriented declaration postings. This deliberately omits the complete
// semantic record so name navigation can avoid decoding GraphFacts.
message ArtifactSymbolPostings {
  repeated ArtifactSymbolPosting entries = 1;
}
message ArtifactSymbolPosting {
  uint32 source_unit_index = 1;
  uint32 symbol_ordinal = 2;
}

// Direct hierarchy is an independent query projection. It routes a direct
// implementations lookup without reading the complete graph payload.
message ArtifactHierarchyPostings {
  repeated ArtifactHierarchyPosting entries = 1;
}
message ArtifactHierarchyPosting {
  string subtype_symbol_id = 1;
  string supertype_symbol_id = 2;
  string precision = 3;
}

// Sorted exact-name routing table. The ordinal identifies one declaration in
// the artifact-local symbol sequence without carrying its complete metadata.
message ArtifactQualifiedSymbolDirectory {
  repeated ArtifactQualifiedSymbolEntry entries = 1;
}
message ArtifactQualifiedSymbolEntry {
  string qualified_name = 1;
  uint32 symbol_ordinal = 2;
}

// Detail blocks are addressed by their ordinal interval in the TOC. Fields
// shared by a dependency artifact are inherited from its snapshot/descriptor.
message ArtifactSymbolDetailBlock {
  uint32 first_symbol_ordinal = 1;
  ArtifactSymbolSnapshotDefaults defaults = 2;
  repeated ArtifactSymbolDetail entries = 3;
}
// Values shared by declarations emitted for one snapshot. Keeping them in the
// block lets a reader reconstruct one declaration without reading GraphFacts.
message ArtifactSymbolSnapshotDefaults {
  ArtifactSourceUnit source_unit = 1;
  repeated ArtifactProvenance provenances = 2;
  string language = 3;
  string freshness = 4;
  string completeness = 5;
  string component_id = 6;
  optional uint32 provenance_index = 7;
  repeated string string_table = 8;
}
message ArtifactSymbolDetail {
  string id = 1;
  string backend_key = 2;
  uint32 backend_schema_version = 3;
  string kind = 4;
  string name = 5;
  optional string qualified_name = 6;
  optional string signature = 7;
  ArtifactRange declaration = 8;
  ArtifactRange name_range = 9;
  optional string owner_id = 10;
  repeated string modifiers = 11;
  repeated string applied_symbol_ids = 12;
  optional string language = 13;
  optional string freshness = 14;
  optional string completeness = 15;
  optional string component_id = 16;
  optional uint32 provenance_index = 17;
  optional uint32 backend_key_string_index = 18;
  optional uint32 kind_string_index = 19;
  optional uint32 name_string_index = 20;
  optional uint32 qualified_name_string_index = 21;
  optional uint32 signature_string_index = 22;
  optional uint32 owner_id_string_index = 23;
  repeated uint32 modifier_string_indexes = 24;
  repeated uint32 applied_symbol_string_indexes = 25;
}

message GraphArtifact {
  repeated GraphSnapshot snapshots = 1;
}

// Facts remain grouped by their immutable source unit, exactly as in the
// canonical model. IDs are opaque stable strings rather than worker objects.
message GraphSnapshot {
  ArtifactSourceUnit source_unit = 1;
  optional string structural_fingerprint = 2;
  optional string public_api_fingerprint = 3;
  repeated ArtifactProvenance provenances = 4;
  repeated ArtifactSymbol symbols = 5;
  repeated ArtifactOccurrence occurrences = 6;
  repeated ArtifactReference references = 7;
  repeated ArtifactCall calls = 8;
  repeated ArtifactHierarchy hierarchy = 9;
  repeated ArtifactType types = 10;
  repeated ArtifactDiagnostic diagnostics = 11;
  string completeness = 12;
  optional uint32 provenance_index = 13;
}

message ArtifactSourceUnit {
  string id = 1;
  string component = 2;
  string path = 3;
  string language = 4;
  string origin = 5;
  string content_fingerprint = 6;
  string context_fingerprint = 7;
}

message ArtifactProvenance {
  string backend = 1;
  string backend_version = 2;
  uint32 worker_protocol_version = 3;
  string analysis_options_fingerprint = 4;
}

message ArtifactRange { uint64 start = 1; uint64 end = 2; }
message ArtifactLocation { uint32 source_unit_index = 1; ArtifactRange range = 2; }

message ArtifactSymbol {
  string id = 1;
  string backend_key = 2;
  uint32 backend_schema_version = 3;
  string language = 4;
  string kind = 5;
  string name = 6;
  optional string qualified_name = 7;
  optional string signature = 8;
  ArtifactRange declaration = 9;
  ArtifactRange name_range = 10;
  optional string owner_id = 11;
  repeated string modifiers = 12;
  string freshness = 14;
  string completeness = 15;
  string component_id = 16;
  optional uint32 provenance_index = 17;
  optional uint32 owner_symbol_ordinal = 18;
  repeated string applied_symbol_ids = 13;
}

message ArtifactOccurrence {
  ArtifactLocation location = 1;
  string kind = 2;
  optional string enclosing_symbol_id = 3;
  optional string target_symbol_id = 4;
  optional string type_id = 5;
  string precision = 6;
  string freshness = 7;
  string completeness = 8;
  optional uint32 provenance_index = 9;
  optional uint32 enclosing_symbol_ordinal = 10;
  optional uint32 target_symbol_ordinal = 11;
}

message ArtifactReference { uint32 source_occurrence_index = 1; string target_symbol_id = 2; string precision = 3; optional uint32 target_symbol_ordinal = 4; }
message ArtifactCall { uint32 source_occurrence_index = 1; string target_symbol_id = 2; optional string caller_symbol_id = 3; string precision = 4; optional uint32 target_symbol_ordinal = 5; optional uint32 caller_symbol_ordinal = 6; }
message ArtifactHierarchy { string subtype_symbol_id = 1; string supertype_symbol_id = 2; string precision = 3; optional uint32 provenance_index = 4; optional uint32 subtype_symbol_ordinal = 5; optional uint32 supertype_symbol_ordinal = 6; }
message ArtifactType { string id = 1; string language = 2; string display = 3; optional string backend_key = 4; uint32 backend_schema_version = 5; string freshness = 6; string completeness = 7; optional uint32 provenance_index = 8; }
message ArtifactDiagnostic { uint32 source_unit_index = 1; optional ArtifactRange range = 2; string severity = 3; optional string code = 4; string message = 5; string freshness = 6; string completeness = 7; optional uint32 provenance_index = 8; }
