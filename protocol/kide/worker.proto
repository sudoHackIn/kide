syntax = "proto3";

package kide.worker.v1;

// Control-plane contract between KIDE Core and disposable workers. Artifact
// payloads are deliberately absent: workers write KIDE-owned binary blobs to
// Core-provided staging paths and report only their metadata here.
message Envelope {
  uint32 protocol_version = 1;
  string request_id = 2;
  oneof message {
    HandshakeRequest handshake_request = 10;
    HandshakeResponse handshake_response = 11;
    ArtifactDiscoveryRequest artifact_discovery_request = 12;
    ArtifactDiscoveryResponse artifact_discovery_response = 13;
    Error error = 14;
    ProjectManifestRequest project_manifest_request = 15;
    ProjectManifestResponse project_manifest_response = 19;
    AnalyzeBatchRequest analyze_batch_request = 16;
    AnalysisBatchResponse analysis_batch_response = 20;
    ArtifactMaterializationRequest artifact_materialization_request = 17;
    ArtifactMaterializationResponse artifact_materialization_response = 18;
    AnalysisDelta analysis_delta = 21;
    ArtifactAnalysisRequest artifact_analysis_request = 22;
    ArtifactAnalysisResponse artifact_analysis_response = 23;
    SemanticQueryRequest semantic_query_request = 24;
    SemanticQueryResponse semantic_query_response = 25;
  }
}

message HandshakeRequest { string core_version = 1; }
message HandshakeResponse {
  string backend = 1;
  string backend_version = 2;
  uint32 protocol_version = 3;
  repeated string capabilities = 4;
  repeated string languages = 5;
  repeated SemanticQueryCapability semantic_query_capabilities = 6;
}

// Declarative query capability metadata is static handshake data. It does not
// execute package code or imply that a worker owns persistent query state.
message SemanticQueryCapability {
  string name = 1;
  uint32 version = 2;
  repeated SemanticQueryParameter parameters = 3;
  string result_kind = 4;
}
message SemanticQueryParameter {
  string name = 1;
  string type = 2;
  bool required = 3;
}

message SemanticQueryArgument {
  string name = 1;
  oneof value {
    string symbol_id = 2;
    string component_id = 3;
    string string_value = 4;
    sint64 integer_value = 5;
  }
}
message SemanticQueryBudget {
  uint32 max_candidates = 1;
  uint32 max_nodes = 2;
  uint64 max_bytes = 3;
  uint64 deadline_millis = 4;
}
message SemanticQueryRequest {
  string capability_name = 1;
  uint32 capability_version = 2;
  repeated SemanticQueryArgument arguments = 3;
  repeated string candidate_symbol_ids = 4;
  repeated string candidate_source_unit_ids = 5;
  SemanticQueryBudget budget = 6;
}
message SemanticQueryResponse {
  string capability_name = 1;
  uint32 capability_version = 2;
  string state = 3;
  repeated string candidate_symbol_ids = 4;
  repeated FileAnalysisSnapshot snapshots = 5;
  Provenance provenance = 6;
  uint32 visited_nodes = 7;
  uint64 produced_bytes = 8;
}

message ProjectManifestRequest { string workspace_root = 1; }
message SourceSet { string name = 1; repeated string source_roots = 2; repeated string generated_roots = 3; bool test = 4; }
message Toolchain { string jvm_version = 1; string gradle_version = 2; optional string kotlin_version = 3; }
message Component {
  string id = 1; string name = 2; string build_system = 3; string root = 4;
  repeated string languages = 5; string configuration_fingerprint = 6;
  repeated SourceSet source_sets = 7; repeated string classpath_fingerprints = 8;
  optional Toolchain toolchain = 9; optional string compiler_configuration_fingerprint = 10;
}
message DependencyEdge { string from_component_id = 1; oneof target { string component_id = 2; string artifact_fingerprint = 3; } string scope = 4; }
message ProjectManifest { string workspace = 1; string root = 2; repeated Component components = 3; repeated DependencyEdge dependencies = 4; string fingerprint = 5; Provenance provenance = 6; }
message ProjectManifestResponse { ProjectManifest manifest = 1; }

message SourceUnit {
  string id = 1;
  string component = 2;
  string path = 3;
  string language = 4;
  string origin = 5;
  string content = 6;
  string context = 7;
}
message Provenance {
  string backend = 1;
  string backend_version = 2;
  uint32 protocol_version = 3;
  string analysis_options_fingerprint = 4;
}
message AnalyzeBatchRequest {
  string workspace = 1;
  string project_fingerprint = 2;
  repeated string requested_facts = 3;
  repeated SourceUnit source_units = 4;
}
message ByteRange { uint64 start = 1; uint64 end = 2; }
message SymbolDeclaration {
  string id = 1;
  uint32 source_unit_index = 2;
  uint32 provenance_index = 3;
  string backend_key = 4;
  uint32 backend_schema_version = 5;
  string language = 6;
  string kind = 7;
  string name = 8;
  optional string qualified_name = 9;
  optional string signature = 10;
  ByteRange declaration = 11;
  ByteRange name_range = 12;
  optional string owner_id = 13;
  repeated string modifiers = 14;
  string freshness = 16;
  string completeness = 17;
  string component_id = 18;
  repeated string applied_symbol_ids = 15;
}
message AnalysisBatchResponse {
  repeated FileAnalysisSnapshot snapshots = 1;
}
// Facts are grouped by the immutable source snapshot that owns them. This
// prevents a worker response from accidentally mixing generations of a file.
message FileAnalysisSnapshot {
  SourceUnit source_unit = 1;
  optional string structural_fingerprint = 2;
  optional string public_api_fingerprint = 3;
  repeated Provenance provenances = 4;
  repeated SymbolDeclaration symbols = 5;
  repeated Occurrence occurrences = 6;
  repeated ReferenceEdge references = 7;
  repeated CallEdge calls = 8;
  repeated HierarchyEdge hierarchy = 9;
  repeated TypeRecord types = 10;
  repeated Diagnostic diagnostics = 11;
  string completeness = 12;
  uint32 provenance_index = 13;
  repeated ApplicationFact applications = 14;
}
message ApplicationArgument {
  optional string name = 1;
  uint32 position = 2;
  oneof value { string string_value = 3; bool boolean_value = 4; sint64 integer_value = 5; }
  repeated string string_list_value = 6;
}
message ApplicationFact {
  string id = 1;
  string subject_symbol_id = 2;
  string target_symbol_id = 3;
  ByteRange range = 4;
  repeated ApplicationArgument arguments = 5;
  string precision = 6;
  string freshness = 7;
  string completeness = 8;
  uint32 provenance_index = 9;
}
message SourceLocation {
  uint32 source_unit_index = 1;
  ByteRange range = 2;
}
message ReferenceEdge {
  uint32 source_occurrence_index = 1;
  string target_symbol_id = 2;
  string precision = 3;
}
message CallEdge {
  uint32 source_occurrence_index = 1;
  string target_symbol_id = 2;
  optional string caller_symbol_id = 3;
  string precision = 4;
}
message HierarchyEdge {
  string subtype_symbol_id = 1;
  string supertype_symbol_id = 2;
  string precision = 3;
  uint32 provenance_index = 4;
}
message Occurrence {
  SourceLocation location = 1;
  string kind = 2;
  optional string enclosing_symbol_id = 3;
  optional string target_symbol_id = 4;
  optional string type_id = 5;
  string precision = 6;
  string freshness = 7;
  string completeness = 8;
  uint32 provenance_index = 9;
}
message TypeRecord {
  string id = 1;
  string language = 2;
  string display = 3;
  optional string backend_key = 4;
  uint32 backend_schema_version = 5;
  string freshness = 6;
  string completeness = 7;
  uint32 provenance_index = 8;
}
message Diagnostic {
  uint32 source_unit_index = 1;
  optional ByteRange range = 2;
  string severity = 3;
  optional string code = 4;
  string message = 5;
  string freshness = 6;
  string completeness = 7;
  uint32 provenance_index = 8;
}
message AnalysisDelta {
  string source_unit_id = 1;
  optional string previous_content_fingerprint = 2;
  optional FileAnalysisSnapshot snapshot = 3;
}
message ArtifactAnalysisRequest {
  string workspace_root = 1;
  uint32 max_artifacts = 2;
  optional string cursor = 3;
}
message ArtifactAnalysisResponse {
  repeated FileAnalysisSnapshot snapshots = 1;
  optional string next_cursor = 2;
}

message ArtifactDiscoveryRequest {
  string workspace_root = 1;
  uint32 max_artifacts = 2;
  optional string cursor = 3;
}
message ArtifactDescriptor {
  string source_unit_id = 1;
  string component_id = 2;
  string workspace_path = 3;
  string content_fingerprint = 4;
  string context_fingerprint = 5;
  string backend = 6;
  string backend_version = 7;
  uint32 worker_protocol_version = 8;
  string analysis_options_fingerprint = 9;
  string language = 10;
  string origin = 11;
  repeated SymbolLocator symbol_locators = 12;
}
message SymbolLocator { string qualified_name = 1; string symbol_id = 2; }
message ArtifactDiscoveryResponse {
  repeated ArtifactDescriptor artifacts = 1;
  optional string next_cursor = 2;
}
message ArtifactMaterializationRequest {
  string workspace_root = 1;
  ArtifactDescriptor artifact = 2;
  string staging_directory = 3;
  uint32 blob_format_version = 4;
}
message ArtifactMaterializationResponse {
  string staged_filename = 1;
  uint64 byte_length = 2;
  bytes sha256 = 3;
  uint32 blob_format_version = 4;
}
message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  uint32 supported_protocol_version = 4;
  optional uint32 received_protocol_version = 5;
}
